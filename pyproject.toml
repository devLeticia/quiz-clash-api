[project]
name = "quiz-clash"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
quiz-clash = "quiz_clash:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"  # ajuste pra sua versão real (veja .python-version)

[tool.ruff.lint]
select = [
    "E",   # erros de estilo (pycodestyle)
    "F",   # erros lógicos (pyflakes) - imports não usados, variáveis não usadas, etc
    "I",   # organização de imports
    "UP",  # sugestões de sintaxe mais moderna
]

[tool.ruff.format]
quote-style = "double"
