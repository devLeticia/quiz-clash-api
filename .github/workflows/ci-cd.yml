name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/devleticia/quiz-clash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  deploy:
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2
        env:
          INSTANCE_NAME: ${{ vars.INSTANCE_NAME }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=['/opt/quiz-clash/deploy.sh ${{ github.sha }}']" \
            --query Command.CommandId --output text)

          for _ in $(seq 60); do
            sleep 5
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          test "$status" = Success

      - name: Smoke test
        run: curl --fail --silent --retry 10 --retry-delay 5 --retry-all-errors https://api.quizclash.online/
